buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    //noinspection GradleDependency
    implementation 'androidx.core:core:1.13.1'
}

android {
    /*******************************************************
     * The following variables are defined in gradle.properties
     * by Qt Creator / androiddeployqt:
     *
     * - androidCompileSdkVersion
     * - qtAndroidDir
     * - qtGradlePluginType
     * - androidNdkVersion
     * - qtTargetAbiList
     *
     * Do not normally change these values manually.
     *******************************************************/

    namespace = androidPackageName

    compileSdk = 36

    ndkVersion = androidNdkVersion

    // Extract native libraries from the APK
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'

            java.srcDirs = [
                qtAndroidDir + '/src',
                'src',
                'java'
            ]

            aidl.srcDirs = [
                qtAndroidDir + '/src',
                'src',
                'aidl'
            ]

            res.srcDirs = [
                qtAndroidDir + '/res',
                'res'
            ]

            resources.srcDirs = ['resources']

            assets.srcDirs = ['assets']

            jniLibs.srcDirs = ['libs']
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }

    // Do not compress Qt binary resource files
    androidResources {
        noCompress += ['rcc']
    }

    defaultConfig {
        resConfig "en"

        minSdk 30
        targetSdk 36

        ndk {
            abiFilters.addAll(qtTargetAbiList.split(","))
        }
    }

    /*buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true

            proguardFiles(
                getDefaultProguardFile(
                    'proguard-android-optimize.txt'
                ),
                'proguard-rules.pro'
            )
        }
    }*/
}
